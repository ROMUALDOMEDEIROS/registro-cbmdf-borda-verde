name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  # Permite publicar manualmente pela aba Actions do GitHub.
  workflow_dispatch:

# O build é enviado para a branch gh-pages, de onde o GitHub Pages serve o site.
# Esse caminho só precisa de escrita no repositório — ao contrário da publicação
# via artefato, que exige o Pages configurado com Source: GitHub Actions.
permissions:
  contents: write

# Uma publicação por vez; não cancela a que já estiver em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Gerar build de produção
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_APPS_SCRIPT_URL: ${{ secrets.VITE_APPS_SCRIPT_URL }}

      # .nojekyll impede que o Jekyll do Pages ignore arquivos iniciados por "_".
      - name: Publicar na branch gh-pages
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Publica ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
