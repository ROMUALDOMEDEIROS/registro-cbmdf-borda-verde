<title>Narrador — Texto em voz alta</title>

<style>
  :root {
    color-scheme: light dark;

    --verde: #0b894a;
    --verde-forte: #086637;
    --verde-tenue: rgba(11, 137, 74, 0.12);
    --laranja: #f06335;
    --papel: #f6f2ee;
    --papel-alto: #fffdfa;
    --tinta: #14231b;
    --tinta-suave: #5d6b63;
    --linha: rgba(20, 35, 27, 0.13);
    --sombra: 0 24px 60px -32px rgba(20, 35, 27, 0.5);

    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --serifada: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --verde: #2fb26b;
      --verde-forte: #0b894a;
      --verde-tenue: rgba(47, 178, 107, 0.16);
      --laranja: #ff7a4d;
      --papel: #171d1a;
      --papel-alto: #202826;
      --tinta: #eaefec;
      --tinta-suave: #93a49a;
      --linha: rgba(255, 255, 255, 0.13);
      --sombra: 0 24px 60px -32px rgba(0, 0, 0, 0.8);
    }
  }

  :root[data-theme="dark"] {
    --verde: #2fb26b;
    --verde-forte: #0b894a;
    --verde-tenue: rgba(47, 178, 107, 0.16);
    --laranja: #ff7a4d;
    --papel: #171d1a;
    --papel-alto: #202826;
    --tinta: #eaefec;
    --tinta-suave: #93a49a;
    --linha: rgba(255, 255, 255, 0.13);
    --sombra: 0 24px 60px -32px rgba(0, 0, 0, 0.8);
  }

  :root[data-theme="light"] {
    --verde: #0b894a;
    --verde-forte: #086637;
    --verde-tenue: rgba(11, 137, 74, 0.12);
    --laranja: #f06335;
    --papel: #f6f2ee;
    --papel-alto: #fffdfa;
    --tinta: #14231b;
    --tinta-suave: #5d6b63;
    --linha: rgba(20, 35, 27, 0.13);
    --sombra: 0 24px 60px -32px rgba(20, 35, 27, 0.5);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--papel);
    color: var(--tinta);
    font-family: var(--sans);
    -webkit-text-size-adjust: 100%;
  }

  .app {
    max-width: 40rem;
    margin: 0 auto;
    padding: 1.75rem 1.25rem 10.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  /* ---------- Cabeçalho ---------- */

  .topo {
    display: flex;
    align-items: center;
    gap: 0.875rem;
  }

  .marca {
    width: 2.75rem;
    height: 2.75rem;
    border-radius: 0.85rem;
    background: linear-gradient(140deg, var(--verde), var(--verde-forte));
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.16rem;
    flex: none;
  }

  .marca i {
    display: block;
    width: 0.17rem;
    border-radius: 0.17rem;
    background: #fff;
  }

  .marca i:nth-child(1), .marca i:nth-child(5) { height: 0.5rem; }
  .marca i:nth-child(2), .marca i:nth-child(4) { height: 0.95rem; }
  .marca i:nth-child(3) { height: 1.4rem; }

  .titulo { display: flex; flex-direction: column; gap: 0.15rem; }

  h1 {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  .subtitulo {
    margin: 0;
    font-size: 0.66rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.19em;
    color: var(--tinta-suave);
  }

  /* ---------- Painel de leitura ---------- */

  .palco {
    background: var(--papel-alto);
    border: 1px solid var(--linha);
    border-radius: 1.4rem;
    box-shadow: var(--sombra);
    overflow: hidden;
  }

  .barra-progresso {
    height: 3px;
    background: var(--linha);
  }

  .barra-progresso span {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--verde);
    transition: width 0.18s linear;
  }

  .rotulos {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    padding: 0.9rem 1.15rem 0;
  }

  .rotulo {
    font-size: 0.6rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.19em;
    color: var(--tinta-suave);
  }

  .medidas {
    font-family: var(--mono);
    font-size: 0.68rem;
    font-variant-numeric: tabular-nums;
    color: var(--tinta-suave);
  }

  #editor, #leitura {
    width: 100%;
    min-height: 14rem;
    max-height: 26rem;
    padding: 0.85rem 1.15rem 1.3rem;
    font-family: var(--serifada);
    font-size: 1.06rem;
    line-height: 1.65;
  }

  #editor {
    display: block;
    border: 0;
    background: transparent;
    color: inherit;
    resize: vertical;
    outline: none;
  }

  #editor::placeholder { color: var(--tinta-suave); opacity: 0.75; }

  #leitura {
    display: none;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .narrando #editor { display: none; }
  .narrando #leitura { display: block; }

  #lido { color: var(--tinta-suave); }

  #atual {
    background: var(--verde-tenue);
    color: inherit;
    border-radius: 0.2rem;
    box-shadow: inset 0 -2px 0 var(--verde);
    padding: 0.05em 0.06em;
  }

  /* ---------- Ações sobre o texto ---------- */

  .acoes {
    display: flex;
    gap: 0.6rem;
    padding: 0 1.15rem 1.15rem;
  }

  .fantasma {
    flex: 1;
    padding: 0.7rem 0.5rem;
    border: 1px solid var(--linha);
    border-radius: 0.8rem;
    background: transparent;
    color: var(--tinta-suave);
    font-family: inherit;
    font-size: 0.62rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }

  .fantasma:hover:not(:disabled) { color: var(--verde); border-color: var(--verde); }
  .fantasma:disabled { opacity: 0.4; cursor: default; }

  /* ---------- Ajustes ---------- */

  details.ajustes {
    background: var(--papel-alto);
    border: 1px solid var(--linha);
    border-radius: 1.4rem;
    overflow: hidden;
  }

  details.ajustes > summary {
    padding: 1rem 1.15rem;
    cursor: pointer;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.62rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.19em;
    color: var(--tinta-suave);
  }

  details.ajustes > summary::-webkit-details-marker { display: none; }
  details.ajustes > summary::after { content: "+"; font-size: 1rem; line-height: 1; }
  details.ajustes[open] > summary::after { content: "–"; }

  .corpo-ajustes {
    padding: 0 1.15rem 1.3rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .campo { display: flex; flex-direction: column; gap: 0.45rem; }

  .campo-topo {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.75rem;
  }

  .valor {
    font-family: var(--mono);
    font-size: 0.7rem;
    font-variant-numeric: tabular-nums;
    color: var(--verde);
    font-weight: 700;
  }

  select {
    width: 100%;
    padding: 0.7rem 0.8rem;
    border: 1px solid var(--linha);
    border-radius: 0.8rem;
    background: var(--papel);
    color: var(--tinta);
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
  }

  .escolha-rapida {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
  }

  .voz-atalho {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    padding: 0.7rem 0.8rem;
    border: 1px solid var(--linha);
    border-radius: 0.8rem;
    background: transparent;
    color: inherit;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }

  .voz-atalho:hover:not(:disabled) { border-color: var(--verde); }
  .voz-atalho:disabled { opacity: 0.4; cursor: default; }
  .voz-atalho.ativa { border-color: var(--verde); background: var(--verde-tenue); }

  .voz-genero {
    font-size: 0.6rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.17em;
    color: var(--tinta-suave);
  }

  /* Marca discreta para as vozes neurais, que soam menos robóticas. */
  .voz-atalho.natural .voz-genero::after {
    content: " ✦";
    color: var(--verde);
  }

  .voz-nome {
    font-size: 0.78rem;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .falta-voz {
    margin: 0;
    font-size: 0.72rem;
    line-height: 1.5;
    color: var(--tinta-suave);
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--verde);
    cursor: pointer;
  }

  .link {
    background: none;
    border: 0;
    padding: 0;
    color: var(--verde);
    font-family: inherit;
    font-size: 0.6rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    cursor: pointer;
  }

  /* ---------- Aviso ---------- */

  .aviso {
    display: none;
    gap: 0.7rem;
    align-items: flex-start;
    padding: 0.9rem 1.05rem;
    border: 1px solid var(--laranja);
    border-radius: 1rem;
    background: color-mix(in srgb, var(--laranja) 10%, transparent);
    color: var(--tinta);
    font-size: 0.8rem;
    line-height: 1.45;
  }

  /* Andamento não é problema: o mesmo bloco, em verde, sem ar de alerta. */
  .aviso.andamento {
    border-color: var(--verde);
    background: var(--verde-tenue);
  }

  .aviso.visivel { display: flex; }
  .aviso strong { color: var(--laranja); }

  /* ---------- Transporte ---------- */

  .transporte {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 0.85rem 1.25rem calc(0.85rem + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--papel) 88%, transparent);
    backdrop-filter: blur(14px);
    border-top: 1px solid var(--linha);
  }

  .transporte-interno {
    max-width: 40rem;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 0.7rem;
  }

  .equalizador {
    display: flex;
    align-items: center;
    gap: 0.18rem;
    height: 2.9rem;
    padding: 0 0.55rem;
    flex: none;
  }

  .equalizador b {
    display: block;
    width: 0.19rem;
    height: 0.4rem;
    border-radius: 0.19rem;
    background: var(--tinta-suave);
    opacity: 0.45;
  }

  .narrando .equalizador b {
    background: var(--verde);
    opacity: 1;
    animation: pulsar 0.85s ease-in-out infinite alternate;
  }

  .narrando .equalizador b:nth-child(2) { animation-delay: 0.12s; }
  .narrando .equalizador b:nth-child(3) { animation-delay: 0.26s; }
  .narrando .equalizador b:nth-child(4) { animation-delay: 0.06s; }
  .narrando .equalizador b:nth-child(5) { animation-delay: 0.19s; }

  .pausado .equalizador b { animation-play-state: paused; }

  @keyframes pulsar {
    from { height: 0.4rem; }
    to { height: 1.7rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .narrando .equalizador b { animation: none; height: 1rem; }
    .barra-progresso span { transition: none; }
  }

  .botao {
    flex: 1;
    padding: 0.95rem 0.75rem;
    border: 0;
    border-radius: 0.9rem;
    background: var(--verde);
    color: #fff;
    font-family: inherit;
    font-size: 0.7rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.17em;
    cursor: pointer;
    transition: filter 0.15s, transform 0.1s;
  }

  .botao:hover:not(:disabled) { filter: brightness(1.08); }
  .botao:active:not(:disabled) { transform: scale(0.985); }
  .botao:disabled { opacity: 0.4; cursor: default; }
  .botao.parar { flex: 0 0 8rem; background: var(--laranja); }

  :is(button, select, input, textarea, summary):focus-visible {
    outline: 2px solid var(--verde);
    outline-offset: 2px;
  }

  .nota {
    text-align: center;
    font-size: 0.66rem;
    line-height: 1.6;
    color: var(--tinta-suave);
  }

  .oculto { display: none !important; }
</style>

<main class="app" id="app">
  <div class="topo">
    <div class="marca" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="titulo">
      <h1>Narrador</h1>
      <p class="subtitulo">Texto e PDF em voz alta</p>
    </div>
  </div>

  <p class="aviso" id="aviso" role="status"><span id="aviso-texto"></span></p>

  <section class="palco">
    <div class="barra-progresso"><span id="progresso"></span></div>

    <div class="rotulos">
      <span class="rotulo">Seu texto</span>
      <span class="medidas" id="medidas">0 palavras · 0:00</span>
    </div>

    <textarea id="editor" placeholder="Digite, cole o texto aqui ou carregue um PDF ou arquivo de texto."></textarea>
    <div id="leitura" aria-live="off"><span id="lido"></span><mark id="atual"></mark><span id="resto"></span></div>

    <div class="acoes">
      <button type="button" class="fantasma" id="btn-arquivo">Carregar arquivo</button>
      <button type="button" class="fantasma" id="btn-limpar">Limpar</button>
      <input type="file" id="arquivo" accept=".txt,.md,.csv,.pdf,text/plain,application/pdf" class="oculto">
    </div>
  </section>

  <details class="ajustes" open>
    <summary>Voz e ajustes</summary>
    <div class="corpo-ajustes">
      <div class="campo">
        <div class="campo-topo">
          <label class="rotulo" for="voz">Voz</label>
          <button type="button" class="link" id="btn-idiomas">Ver todos os idiomas</button>
        </div>
        <div class="escolha-rapida">
          <button type="button" class="voz-atalho" id="voz-feminina">
            <span class="voz-genero">Feminina</span>
            <span class="voz-nome">—</span>
          </button>
          <button type="button" class="voz-atalho" id="voz-masculina">
            <span class="voz-genero">Masculina</span>
            <span class="voz-nome">—</span>
          </button>
        </div>
        <select id="voz"></select>
        <p class="falta-voz" id="falta-voz" hidden></p>
      </div>

      <div class="campo">
        <div class="campo-topo">
          <label class="rotulo" for="velocidade">Velocidade</label>
          <span class="valor" id="valor-velocidade">1.0x</span>
        </div>
        <input type="range" id="velocidade" min="0.5" max="2" step="0.1" value="1">
      </div>

      <div class="campo">
        <div class="campo-topo">
          <label class="rotulo" for="tom">Tom</label>
          <span class="valor" id="valor-tom">1.0</span>
        </div>
        <input type="range" id="tom" min="0.5" max="2" step="0.1" value="1">
      </div>

      <div class="campo">
        <div class="campo-topo">
          <label class="rotulo" for="volume">Volume</label>
          <span class="valor" id="valor-volume">100%</span>
        </div>
        <input type="range" id="volume" min="0" max="1" step="0.05" value="1">
      </div>

      <button type="button" class="fantasma" id="btn-padrao">Voltar ao padrão</button>
    </div>
  </details>

  <p class="nota">
    As vozes vêm do próprio aparelho — nada é enviado para servidores.<br>
    Para virar app: no Safari (iPhone) ou Chrome (Android), use <strong>Adicionar à tela de início</strong>.
  </p>
</main>

<div class="transporte">
  <div class="transporte-interno">
    <div class="equalizador" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b></div>
    <button type="button" class="botao" id="btn-tocar">Narrar texto</button>
    <button type="button" class="botao parar oculto" id="btn-parar">Parar</button>
  </div>
</div>

<script>
  (function () {
    'use strict';

    var CHAVE_TEXTO = 'narrador_texto';
    var CHAVE_PREFS = 'narrador_preferencias';
    var PALAVRAS_POR_MINUTO = 150;
    var TAMANHO_BLOCO = 160;

    var MENSAGENS = {
      'synthesis-failed': 'O motor de voz do aparelho falhou. Verifique se há vozes instaladas no sistema.',
      'synthesis-unavailable': 'Nenhum motor de voz disponível neste aparelho.',
      'audio-busy': 'A saída de áudio está ocupada. Tente de novo em instantes.',
      'audio-hardware': 'Nenhuma saída de áudio disponível.',
      'language-unavailable': 'O idioma da voz escolhida não está disponível.',
      'voice-unavailable': 'A voz escolhida não está mais disponível. Escolha outra.',
      'not-allowed': 'O navegador bloqueou a narração. Toque na tela e tente de novo.',
      'network': 'Esta voz depende de conexão e a rede falhou. Escolha uma voz local.'
    };

    var el = function (id) { return document.getElementById(id); };

    var app = el('app'), editor = el('editor'), leitura = el('leitura');
    var lido = el('lido'), atual = el('atual'), resto = el('resto');
    var progresso = el('progresso'), medidas = el('medidas');
    var aviso = el('aviso'), avisoTexto = el('aviso-texto');
    var seletorVoz = el('voz'), btnIdiomas = el('btn-idiomas'), faltaVoz = el('falta-voz');
    var btnTocar = el('btn-tocar'), btnParar = el('btn-parar');
    var btnArquivo = el('btn-arquivo'), arquivo = el('arquivo');
    var btnLimpar = el('btn-limpar'), btnPadrao = el('btn-padrao');

    var controles = {
      velocidade: { campo: el('velocidade'), saida: el('valor-velocidade'), padrao: 1, formatar: function (v) { return v.toFixed(1) + 'x'; } },
      tom: { campo: el('tom'), saida: el('valor-tom'), padrao: 1, formatar: function (v) { return v.toFixed(1); } },
      volume: { campo: el('volume'), saida: el('valor-volume'), padrao: 1, formatar: function (v) { return Math.round(v * 100) + '%'; } }
    };

    var suportado = 'speechSynthesis' in window;
    var vozes = [];
    var apenasPortugues = true;
    var vozURI = '';
    var falando = false;
    var pausado = false;
    var blocos = [];
    var indiceBloco = 0;
    var manterVivo = null;

    /* ---------- Preferências ---------- */

    function carregarPreferencias() {
      var salvas;
      try { salvas = JSON.parse(localStorage.getItem(CHAVE_PREFS) || '{}'); } catch (e) { salvas = {}; }
      Object.keys(controles).forEach(function (nome) {
        var valor = typeof salvas[nome] === 'number' ? salvas[nome] : controles[nome].padrao;
        controles[nome].campo.value = valor;
      });
      if (typeof salvas.apenasPortugues === 'boolean') apenasPortugues = salvas.apenasPortugues;
      vozURI = salvas.vozURI || '';
      editor.value = localStorage.getItem(CHAVE_TEXTO) || '';
    }

    function salvarPreferencias() {
      try {
        localStorage.setItem(CHAVE_PREFS, JSON.stringify({
          velocidade: Number(controles.velocidade.campo.value),
          tom: Number(controles.tom.campo.value),
          volume: Number(controles.volume.campo.value),
          apenasPortugues: apenasPortugues,
          vozURI: seletorVoz.value
        }));
      } catch (e) { /* modo privado pode bloquear */ }
    }

    /* ---------- Medidas ---------- */

    function contarPalavras(texto) {
      var limpo = texto.trim();
      return limpo ? limpo.split(/\s+/).length : 0;
    }

    function formatarDuracao(segundos) {
      var m = Math.floor(segundos / 60), s = segundos % 60;
      return m + ':' + String(s).padStart(2, '0');
    }

    function atualizarMedidas() {
      var palavras = contarPalavras(editor.value);
      var velocidade = Number(controles.velocidade.campo.value);
      var segundos = palavras ? Math.round((palavras / (PALAVRAS_POR_MINUTO * velocidade)) * 60) : 0;
      medidas.textContent = palavras + (palavras === 1 ? ' palavra · ' : ' palavras · ') + formatarDuracao(segundos);
      btnTocar.disabled = !suportado || !editor.value.trim() || vozes.length === 0;
    }

    /* ---------- Divisão em blocos ---------- */

    function dividirEmBlocos(texto) {
      var lista = [], cursor = 0;
      while (cursor < texto.length) {
        if (texto.length - cursor <= TAMANHO_BLOCO) {
          if (texto.slice(cursor).trim()) lista.push({ texto: texto.slice(cursor), inicio: cursor });
          break;
        }
        var janela = texto.slice(cursor, cursor + TAMANHO_BLOCO);
        var corte = Math.max(janela.lastIndexOf('. '), janela.lastIndexOf('! '), janela.lastIndexOf('? '), janela.lastIndexOf('\n'));
        if (corte < TAMANHO_BLOCO * 0.4) corte = janela.lastIndexOf('; ');
        if (corte < TAMANHO_BLOCO * 0.4) corte = janela.lastIndexOf(', ');
        if (corte < TAMANHO_BLOCO * 0.4) corte = janela.lastIndexOf(' ');
        if (corte <= 0) corte = TAMANHO_BLOCO - 1;
        var fim = cursor + corte + 1;
        if (texto.slice(cursor, fim).trim()) lista.push({ texto: texto.slice(cursor, fim), inicio: cursor });
        cursor = fim;
      }
      return lista;
    }

    /* ---------- Vozes ---------- */

    // --- Leitura de PDF -----------------------------------------------------
    // Este arquivo é único e funciona offline; o pdf.js pesa mais de 1 MB e por
    // isso só é buscado quando um PDF é de fato escolhido. Sem internet nesse
    // momento, o resto do narrador continua funcionando normalmente.
    var PDF_CDN = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.7.284/build/';
    var promessaPdfJs = null;

    function ehPdf(arquivo) {
      return arquivo.type === 'application/pdf' || /\.pdf$/i.test(arquivo.name);
    }

    function carregarPdfJs() {
      promessaPdfJs = promessaPdfJs || import(PDF_CDN + 'pdf.min.mjs').then(function (lib) {
        lib.GlobalWorkerOptions.workerSrc = PDF_CDN + 'pdf.worker.min.mjs';
        return lib;
      }, function () {
        promessaPdfJs = null;
        throw new Error('A leitura de PDF precisa de internet na primeira vez. Conecte-se e tente de novo.');
      });

      return promessaPdfJs;
    }

    function espacamentoTipico(linhas) {
      var distancias = [];
      for (var i = 1; i < linhas.length; i++) {
        var d = linhas[i - 1].base - linhas[i].base;
        if (d > 0) distancias.push(d);
      }
      if (!distancias.length) return 0;
      distancias.sort(function (a, b) { return a - b; });
      return distancias[Math.floor(distancias.length / 2)];
    }

    // Remonta as linhas soltas do pdf.js em parágrafos: junta a palavra cortada
    // por hífen no fim da linha e usa o espaço vertical extra para separar
    // título de corpo de texto.
    function juntarLinhas(linhas) {
      var salto = espacamentoTipico(linhas) * 1.5;
      var texto = '';
      var anterior = null;

      linhas.forEach(function (item) {
        var linha = item.texto.trim();
        var distante = anterior !== null && salto > 0 && anterior - item.base > salto;
        anterior = item.base;

        if (!linha) {
          if (texto && texto.slice(-2) !== '\n\n') texto += '\n\n';
          return;
        }

        if (distante && texto && texto.slice(-2) !== '\n\n') texto += '\n\n';

        if (!texto || texto.slice(-2) === '\n\n') texto += linha;
        else if (/[a-zà-ÿ0-9]-$/.test(texto)) texto = texto.slice(0, -1) + linha;
        else texto += ' ' + linha;

        if (/[.!?:;]["')\]]?$/.test(linha)) texto += '\n\n';
      });

      return texto.trim();
    }

    function limparTextoDePdf(texto) {
      return texto
        .replace(/\r\n?/g, '\n')
        .replace(/­/g, '')
        .replace(/[ \t ]+/g, ' ')
        .replace(/\n[ \t]+/g, '\n')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
    }

    function extrairTextoDePdf(arquivo, aoProgredir) {
      return carregarPdfJs().then(function (pdfjsLib) {
        return arquivo.arrayBuffer().then(function (dados) {
          return pdfjsLib.getDocument({ data: dados, useSystemFonts: true }).promise;
        }).then(function (documento) {
          var paginas = [];

          function proxima(numero) {
            if (numero > documento.numPages) {
              return documento.destroy().then(function () {
                return limparTextoDePdf(paginas.filter(Boolean).join('\n\n'));
              });
            }

            return documento.getPage(numero).then(function (pagina) {
              return pagina.getTextContent().then(function (conteudo) {
                var linhas = [];
                var atual = '';
                var base = 0;

                conteudo.items.forEach(function (item) {
                  if (typeof item.str !== 'string') return;
                  if (!atual) base = item.transform[5];
                  atual += item.str;
                  if (item.hasEOL) {
                    linhas.push({ texto: atual, base: base });
                    atual = '';
                  }
                });
                if (atual) linhas.push({ texto: atual, base: base });

                pagina.cleanup();
                paginas.push(juntarLinhas(linhas));
                if (aoProgredir) aoProgredir(numero, documento.numPages);
                return proxima(numero + 1);
              });
            });
          }

          return proxima(1);
        });
      });
    }

    function semAcento(texto) {
      return texto.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    // O Android embute o gênero no nome da voz ("pt-br-x-afm#female_1-local").
    // "female" tem de ser testado antes de "male", que é seu sufixo.
    var MARCADOR_FEMININO = /(^|[^a-z])(fe-?male|feminin[ao]|mulher)([^a-z]|$)/;
    var MARCADOR_MASCULINO = /(^|[^a-z])(male|masculin[ao]|homem)([^a-z]|$)/;

    var NOMES_FEMININOS = ['luciana', 'maria', 'francisca', 'camila', 'fernanda', 'vitoria',
      'leticia', 'bianca', 'manuela', 'isabela', 'yara', 'giovanna', 'brenda', 'elza',
      'joana', 'catarina', 'ines', 'raquel', 'helena', 'cecilia', 'margarida'];

    var NOMES_MASCULINOS = ['daniel', 'felipe', 'ricardo', 'antonio', 'julio', 'fabio',
      'thiago', 'donato', 'humberto', 'leandro', 'valter', 'nicolau', 'eddy', 'heitor',
      'duarte', 'joaquim', 'fernando', 'macario', 'tomas'];

    // Vozes sem sinal de gênero no nome, mas de timbre conhecido.
    var GENERO_POR_NOME = {
      'google portugues do brasil': 'feminina',
      'google portugues': 'feminina'
    };

    function generoDaVoz(voz) {
      var conhecida = GENERO_POR_NOME[semAcento(voz.name).trim()];
      if (conhecida) return conhecida;

      var texto = semAcento(voz.name + ' ' + voz.voiceURI);
      if (MARCADOR_FEMININO.test(texto)) return 'feminina';
      if (MARCADOR_MASCULINO.test(texto)) return 'masculina';

      var palavras = texto.split(/[^a-z]+/);
      for (var i = 0; i < palavras.length; i++) {
        if (NOMES_FEMININOS.indexOf(palavras[i]) !== -1) return 'feminina';
        if (NOMES_MASCULINOS.indexOf(palavras[i]) !== -1) return 'masculina';
      }
      return 'desconhecido';
    }

    // Motores antigos (eSpeak, SAPI "Desktop", Pico) soam metálicos; os neurais
    // recentes se anunciam no próprio nome.
    var SINAIS_ROBOTICOS = /(espeak|e-speak|pico|compact|eloquence|festival|flite|desktop)/;
    var SINAIS_NATURAIS = /(google|neural|natural|enhanced|aprimorad|premium|siri|wavenet|multilingual)/;

    function qualidadeDaVoz(voz) {
      var texto = semAcento(voz.name + ' ' + voz.voiceURI);
      if (SINAIS_ROBOTICOS.test(texto)) return 'robotica';
      if (SINAIS_NATURAIS.test(texto)) return 'natural';
      return 'padrao';
    }

    var PESO_QUALIDADE = { natural: 0, padrao: 1, robotica: 2 };
    var DESCRICAO_GENERO = {
      feminina: 'feminina', masculina: 'masculina', desconhecido: 'gênero indefinido'
    };
    var DESCRICAO_QUALIDADE = { natural: 'natural', padrao: 'comum', robotica: 'robótica' };

    function prioridadeDoIdioma(voz) {
      var idioma = voz.lang.toLowerCase().replace('_', '-');
      if (idioma.indexOf('pt-br') === 0) return 0;
      if (idioma.indexOf('pt') === 0) return 1;
      return 2;
    }

    // Melhor voz de um gênero em português: pt-BR na frente, depois as naturais.
    function melhorVoz(genero) {
      var candidatas = vozes.filter(function (v) {
        return v.lang.toLowerCase().indexOf('pt') === 0 && generoDaVoz(v) === genero;
      });
      if (!candidatas.length) return null;

      return candidatas.sort(function (a, b) {
        return prioridadeDoIdioma(a) - prioridadeDoIdioma(b) ||
          PESO_QUALIDADE[qualidadeDaVoz(a)] - PESO_QUALIDADE[qualidadeDaVoz(b)] ||
          a.name.localeCompare(b.name, 'pt-BR');
      })[0];
    }

    function vozesVisiveis() {
      var pt = vozes.filter(function (v) { return v.lang.toLowerCase().indexOf('pt') === 0; });
      return apenasPortugues && pt.length ? pt : vozes;
    }

    function preencherVozes() {
      var lista = vozesVisiveis();
      seletorVoz.innerHTML = '';

      if (!lista.length) {
        var vazio = document.createElement('option');
        vazio.textContent = 'Nenhuma voz encontrada neste aparelho';
        seletorVoz.appendChild(vazio);
        seletorVoz.disabled = true;
        return;
      }

      seletorVoz.disabled = falando;
      lista.forEach(function (voz) {
        var opcao = document.createElement('option');
        opcao.value = voz.voiceURI;
        opcao.textContent = voz.name + ' (' + voz.lang + ') — ' +
          DESCRICAO_GENERO[generoDaVoz(voz)] + ' · ' + DESCRICAO_QUALIDADE[qualidadeDaVoz(voz)];
        seletorVoz.appendChild(opcao);
      });

      var existe = lista.some(function (v) { return v.voiceURI === vozURI; });
      seletorVoz.value = existe ? vozURI : lista[0].voiceURI;
      vozURI = seletorVoz.value;
      atualizarEscolhaRapida();
    }

    // Botões "Feminina" / "Masculina": apontam para a voz mais natural de cada
    // gênero e avisam quando o aparelho não tem nenhuma.
    function atualizarEscolhaRapida() {
      var ausentes = [];

      ['feminina', 'masculina'].forEach(function (genero) {
        var botao = document.getElementById('voz-' + genero);
        var nome = botao.querySelector('.voz-nome');
        var sugestao = melhorVoz(genero);

        botao.dataset.voiceUri = sugestao ? sugestao.voiceURI : '';
        botao.disabled = !sugestao || falando;
        nome.textContent = sugestao ? sugestao.name : 'Não instalada';
        botao.classList.toggle('ativa', !!sugestao && sugestao.voiceURI === vozURI);
        botao.classList.toggle('natural', !!sugestao && qualidadeDaVoz(sugestao) === 'natural');

        if (!sugestao) ausentes.push(DESCRICAO_GENERO[genero]);
      });

      if (ausentes.length && vozes.length) {
        faltaVoz.textContent = 'Este aparelho não tem voz' + (ausentes.length === 1 ? ' ' : 'es ') +
          ausentes.join(' nem ') + ' em português. Instale mais vozes nas configurações do sistema.';
        faltaVoz.hidden = false;
      } else {
        faltaVoz.hidden = true;
      }
    }

    function vozEscolhida() {
      for (var i = 0; i < vozes.length; i++) {
        if (vozes[i].voiceURI === seletorVoz.value) return vozes[i];
      }
      return null;
    }

    function carregarVozes() {
      var lista = window.speechSynthesis.getVoices();
      if (!lista.length) return false;

      // Português do Brasil primeiro, depois as vozes mais naturais.
      vozes = lista.slice().sort(function (a, b) {
        return prioridadeDoIdioma(a) - prioridadeDoIdioma(b) ||
          PESO_QUALIDADE[qualidadeDaVoz(a)] - PESO_QUALIDADE[qualidadeDaVoz(b)] ||
          a.name.localeCompare(b.name, 'pt-BR');
      });

      preencherVozes();
      atualizarMedidas();
      return true;
    }

    /* ---------- Avisos ---------- */

    function mostrarAviso(mensagem, andamento) {
      avisoTexto.textContent = mensagem;
      aviso.classList.toggle('andamento', !!andamento);
      aviso.classList.add('visivel');
    }

    function limparAviso() {
      aviso.classList.remove('visivel', 'andamento');
    }

    /* ---------- Narração ---------- */

    function pintarProgresso(inicio, fim) {
      var texto = editor.value;
      lido.textContent = texto.slice(0, inicio);
      atual.textContent = texto.slice(inicio, fim);
      resto.textContent = texto.slice(fim);
      progresso.style.width = Math.min(100, (fim / texto.length) * 100) + '%';

      var caixa = leitura.getBoundingClientRect();
      var marca = atual.getBoundingClientRect();
      if (marca.height && (marca.top < caixa.top + 24 || marca.bottom > caixa.bottom - 24)) {
        leitura.scrollTop += marca.top - caixa.top - caixa.height / 2;
      }
    }

    function falarBloco() {
      var bloco = blocos[indiceBloco];

      if (!bloco) {
        parar();
        return;
      }

      var fala = new SpeechSynthesisUtterance(bloco.texto);
      var voz = vozEscolhida();
      fala.rate = Number(controles.velocidade.campo.value);
      fala.pitch = Number(controles.tom.campo.value);
      fala.volume = Number(controles.volume.campo.value);
      fala.lang = voz ? voz.lang : 'pt-BR';
      if (voz) { try { fala.voice = voz; } catch (e) { /* referência antiga */ } }

      fala.onboundary = function (evento) {
        if (evento.name && evento.name !== 'word') return;
        var tamanho = evento.charLength;
        if (!tamanho) {
          var sobra = bloco.texto.slice(evento.charIndex);
          var espaco = sobra.search(/\s/);
          tamanho = espaco === -1 ? sobra.length : espaco;
        }
        pintarProgresso(bloco.inicio + evento.charIndex, bloco.inicio + evento.charIndex + tamanho);
      };

      fala.onend = function () {
        if (!falando) return;
        indiceBloco += 1;
        falarBloco();
      };

      fala.onerror = function (evento) {
        if (evento.error === 'interrupted' || evento.error === 'canceled') return;
        mostrarAviso(MENSAGENS[evento.error] || ('Falha na narração (' + evento.error + ').'));
        parar();
      };

      window.speechSynthesis.speak(fala);
    }

    function tocar() {
      if (!suportado) {
        mostrarAviso('Este navegador não suporta narração. Use Chrome, Edge ou Safari atualizados.');
        return;
      }
      if (!editor.value.trim()) return;

      limparAviso();
      window.speechSynthesis.cancel();

      blocos = dividirEmBlocos(editor.value);
      indiceBloco = 0;
      falando = true;
      pausado = false;

      app.classList.add('narrando');
      document.body.classList.add('narrando');
      btnTocar.textContent = 'Pausar';
      btnParar.classList.remove('oculto');
      seletorVoz.disabled = true;
      pintarProgresso(0, 0);

      // O Chrome suspende a fila de fala depois de alguns segundos.
      manterVivo = setInterval(function () {
        if (falando && !pausado) window.speechSynthesis.resume();
      }, 8000);

      falarBloco();
    }

    function alternarPausa() {
      if (pausado) {
        pausado = false;
        window.speechSynthesis.resume();
        btnTocar.textContent = 'Pausar';
        document.body.classList.remove('pausado');
      } else {
        pausado = true;
        window.speechSynthesis.pause();
        btnTocar.textContent = 'Retomar';
        document.body.classList.add('pausado');
      }
    }

    function parar() {
      falando = false;
      pausado = false;
      blocos = [];
      indiceBloco = 0;
      if (manterVivo) { clearInterval(manterVivo); manterVivo = null; }
      if (suportado) window.speechSynthesis.cancel();

      app.classList.remove('narrando');
      document.body.classList.remove('narrando', 'pausado');
      btnTocar.textContent = 'Narrar texto';
      btnParar.classList.add('oculto');
      seletorVoz.disabled = vozes.length === 0;
      atualizarEscolhaRapida();
      progresso.style.width = '0%';
      lido.textContent = atual.textContent = resto.textContent = '';
    }

    /* ---------- Eventos ---------- */

    btnTocar.addEventListener('click', function () {
      if (falando) alternarPausa(); else tocar();
    });

    btnParar.addEventListener('click', parar);

    editor.addEventListener('input', function () {
      atualizarMedidas();
      try { localStorage.setItem(CHAVE_TEXTO, editor.value); } catch (e) { /* modo privado */ }
    });

    editor.addEventListener('keydown', function (evento) {
      if ((evento.metaKey || evento.ctrlKey) && evento.key === 'Enter') tocar();
    });

    btnArquivo.addEventListener('click', function () { arquivo.click(); });

    function aplicarTexto(conteudo) {
      parar();
      editor.value = conteudo;
      editor.dispatchEvent(new Event('input'));
      limparAviso();
    }

    arquivo.addEventListener('change', function () {
      var escolhido = arquivo.files && arquivo.files[0];
      arquivo.value = '';
      if (!escolhido) return;

      if (ehPdf(escolhido)) {
        mostrarAviso('Abrindo o PDF…', true);
        extrairTextoDePdf(escolhido, function (pagina, total) {
          mostrarAviso('Extraindo texto — página ' + pagina + ' de ' + total + '.', true);
        }).then(function (texto) {
          if (!texto.trim()) {
            mostrarAviso('Este PDF não tem texto selecionável — provavelmente é um documento digitalizado.');
            return;
          }
          aplicarTexto(texto);
        }, function (falha) {
          mostrarAviso(String(falha && falha.message || falha));
        });
        return;
      }

      var leitor = new FileReader();
      leitor.onload = function () { aplicarTexto(String(leitor.result)); };
      leitor.onerror = function () { mostrarAviso('Não foi possível ler o arquivo escolhido.'); };
      leitor.readAsText(escolhido);
    });

    btnLimpar.addEventListener('click', function () {
      parar();
      editor.value = '';
      editor.dispatchEvent(new Event('input'));
      limparAviso();
      editor.focus();
    });

    btnIdiomas.addEventListener('click', function () {
      apenasPortugues = !apenasPortugues;
      btnIdiomas.textContent = apenasPortugues ? 'Ver todos os idiomas' : 'Somente português';
      preencherVozes();
      salvarPreferencias();
    });

    seletorVoz.addEventListener('change', function () {
      vozURI = seletorVoz.value;
      atualizarEscolhaRapida();
      salvarPreferencias();
    });

    ['feminina', 'masculina'].forEach(function (genero) {
      el('voz-' + genero).addEventListener('click', function () {
        var escolhida = this.dataset.voiceUri;
        if (!escolhida) return;

        // A voz sugerida pode estar fora da lista visível (ex.: filtro de
        // idioma ativo); nesse caso solta o filtro para que ela apareça.
        vozURI = escolhida;
        if (!Array.prototype.some.call(seletorVoz.options, function (o) { return o.value === escolhida; })) {
          apenasPortugues = false;
          btnIdiomas.textContent = 'Somente português';
        }
        preencherVozes();
        salvarPreferencias();
      });
    });

    Object.keys(controles).forEach(function (nome) {
      var controle = controles[nome];
      controle.campo.addEventListener('input', function () {
        controle.saida.textContent = controle.formatar(Number(controle.campo.value));
        if (nome === 'velocidade') atualizarMedidas();
        salvarPreferencias();
      });
    });

    btnPadrao.addEventListener('click', function () {
      Object.keys(controles).forEach(function (nome) {
        controles[nome].campo.value = controles[nome].padrao;
        controles[nome].campo.dispatchEvent(new Event('input'));
      });
    });

    // Parar a fala ao sair da página evita que o áudio continue em segundo plano.
    window.addEventListener('pagehide', function () {
      if (suportado) window.speechSynthesis.cancel();
    });

    /* ---------- Início ---------- */

    carregarPreferencias();
    btnIdiomas.textContent = apenasPortugues ? 'Ver todos os idiomas' : 'Somente português';
    Object.keys(controles).forEach(function (nome) {
      controles[nome].saida.textContent = controles[nome].formatar(Number(controles[nome].campo.value));
    });
    atualizarMedidas();

    if (!suportado) {
      mostrarAviso('Este navegador não suporta narração. Use Chrome, Edge ou Safari atualizados.');
      btnTocar.disabled = true;
    } else if (!carregarVozes()) {
      // As vozes costumam chegar depois do carregamento da página.
      window.speechSynthesis.onvoiceschanged = carregarVozes;
      setTimeout(function () {
        if (!carregarVozes()) {
          mostrarAviso('Nenhuma voz encontrada neste aparelho. Instale vozes em português nas configurações do sistema.');
        }
      }, 2000);
    }
  })();
</script>
